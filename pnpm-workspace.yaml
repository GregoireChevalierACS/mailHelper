packages:
  - packages/*
  - apps/*

# Quarantaine : une version publiée depuis moins de 3 jours n'est pas installée. La plupart des
# paquets compromis sont détectés et retirés du registre dans ce délai.
minimumReleaseAge: 4320

# Seuls ces paquets ont le droit d'exécuter un script d'installation (téléchargement du binaire
# Electron, compilation d'esbuild). Tout autre script est bloqué.
onlyBuiltDependencies:
  - electron
  - esbuild

# Squirrel.Windows n'est pas utilisé (installeur NSIS, voir apps/desktop/electron-builder.yml) : son
# script d'installation reste bloqué.
ignoredBuiltDependencies:
  - electron-winstaller
