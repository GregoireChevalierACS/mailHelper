name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle exécution sur la même branche annule la précédente, devenue obsolète.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verification:
    name: Vérification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Les tests n'exécutent jamais Electron : inutile de télécharger son binaire ici.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          # Tout l'historique : nécessaire pour vérifier chaque commit de la PR.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation reproductible
        run: pnpm install --frozen-lockfile

      - name: Audit des dépendances
        run: pnpm audit --audit-level high

      # Exception documentée : un bot ne connaît pas le numéro de commit du jour. L'exception repose
      # sur l'auteur de la PR fourni par GitHub, pas sur le message, qui serait falsifiable.
      - name: Format des commits
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: pnpm commits:check ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Lint
        run: pnpm lint

      - name: Architecture
        run: pnpm lint:architecture

      - name: Formatage
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Tests et couverture
        run: pnpm test:coverage

      - name: Build de production
        run: pnpm build

      - name: Test de mutation
        run: pnpm test:mutation

      - name: Rapport de mutation
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rapport-mutation
          path: packages/domain/reports/mutation/
          if-no-files-found: ignore

  installeur:
    name: Installeur Windows
    needs: verification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Installation reproductible
        run: pnpm install --frozen-lockfile

      - name: Installeur et version portable
        run: pnpm package:windows

      - name: Livrables
        uses: actions/upload-artifact@v7
        with:
          name: mailhelper-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
